name: API Tests - Newman CI

on:
  push:
    branches: [khanh, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start SUT Backend & Run Newman Tests
        run: |
          echo "=== 1. Starting SUT Backend ==="
          cd eshop-sut/backend
          npm install
          node database.js
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          echo "SUT started with PID $SERVER_PID"

          echo "=== 2. Health-check Polling ==="
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/products > /dev/null 2>&1; then
              echo "SUT is UP and responding at attempt $i!"
              break
            fi
            echo "Waiting for SUT... ($i/30)"
            sleep 1
          done

          echo "=== 3. Executing Newman Sanity Suite ==="
          cd ../..
          mkdir -p newman/member-1
          npx -p newman -p newman-reporter-htmlextra newman run postman/HW06_API_Testing.postman_collection.json \
            -e postman/HW06_Local.postman_environment.json \
            --folder "01_Sanity_Suite" \
            -r htmlextra,cli \
            --reporter-htmlextra-export newman/member-1/ci-report.html

      - name: Dump SUT Logs on Failure
        if: failure()
        run: |
          echo "=== SUT BACKEND LOGS ==="
          cat eshop-sut/backend/server.log || echo "No server.log found"

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-ci-report
          path: newman/member-1/ci-report.html
